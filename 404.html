<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Estudio Jurídico Pelegrina</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=17">
  <style>
    .nf{min-height:82vh;display:grid;place-items:center;padding:2rem 1.2rem;text-align:center}
    .nf-code{font-family:var(--serif);font-size:clamp(5rem,16vw,9rem);line-height:1;color:var(--wine);opacity:.18}
    .nf h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.6rem);color:var(--wine-dark);margin:.4rem 0 .8rem}
    .nf p{color:var(--muted);max-width:30rem;margin:0 auto 1.8rem;line-height:1.7}
    .nf-actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
    .nf-brand{display:inline-flex;align-items:center;gap:.6rem;margin-bottom:1.6rem}
    .nf-brand img{width:52px;height:52px;border-radius:50%}
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <a class="nf-brand" href="/" aria-label="Estudio Jurídico Pelegrina · Inicio">
        <img src="/logo.png" alt="Estudio Jurídico Pelegrina">
      </a>
      <div class="nf-code" aria-hidden="true">404</div>
      <h1 data-i18n="nf.h1">Esta página no existe</h1>
      <p data-i18n="nf.p">Puede que el enlace esté mal escrito o que la página se haya movido. Lo importante: todo lo demás sigue en su lugar.</p>
      <div class="nf-actions">
        <a class="btn btn-primary" href="/" data-i18n="nf.home">Volver al inicio</a>
        <a class="btn btn-outline-wine" href="/blog/" data-i18n="nf.blog">Leer el blog</a>
      </div>
    </div>
  </main>
  <script src="/i18n.js?v=14"></script>
</body>
</html>
